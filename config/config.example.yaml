# Flare Monitor - Configuration File
# This file contains all configuration settings for the FXRP price monitoring and arbitrage detection system.
# Copy this file to config.yaml and customize as needed.

# ============================================================================
# FLARE NETWORK CONFIGURATION
# ============================================================================
# Connection settings for the Flare blockchain network

flare:
  # RPC endpoints for connecting to Flare Network
  # The monitor will use these endpoints to query DEX smart contracts
  # Primary endpoint is the official Flare RPC, with fallback options
  rpc_endpoints:
    - https://flare-api.flare.network/ext/C/rpc  # Official Flare RPC (rate-limited)
    # Uncomment additional endpoints for failover redundancy:
    # - https://rpc.ankr.com/flare                # Ankr public RPC (best for Europe)
    # - https://flare.public-rpc.com              # Alternative public RPC

  # Flare Network chain ID (14 for mainnet)
  chain_id: 14


# ============================================================================
# DEX CONFIGURATION
# ============================================================================
# List of decentralized exchanges to monitor for FXRP prices
# Each DEX requires factory and router contract addresses
# All 4 DEXes are included for comprehensive arbitrage detection (MVP requirement)

dexes:
  # SparkDEX V2 - Legacy pools (most liquidity has migrated to V3)
  # NOTE: V2 pools have minimal liquidity (~$4.5K). Use V3 for accurate pricing
  - name: SparkDEX_V2
    type: uniswap_v2              # Protocol type (Uniswap V2 compatible)
    factory_address: "0x16b619B04c961E8f4F06C10B42FDAbb328980A89"  # V2Factory contract
    router_address: "0x4a1E5A90e9943467FAd1acea1E7F0e5e88472a1e"   # UniswapV2Router02 contract
    enabled: false                # Disabled - use V3 instead (higher liquidity)
    description: "SparkDEX V2 pools (deprecated - liquidity migrated to V3)"

  # SparkDEX V3 - Main liquidity pools (~$6.4M in FXRP/USDT0)
  # Uniswap V3.1 with concentrated liquidity (99.93% of SparkDEX TVL)
  - name: SparkDEX_V3
    type: uniswap_v3              # Protocol type (Uniswap V3 compatible)
    factory_address: "0x8A2578d23d4C532cC9A98FaD91C0523f5efDE652"  # V3Factory contract
    router_address: "0x8a1E35F5c98C4E85B36B7B253222eE17773b2781"   # SwapRouter contract
    enabled: true                 # Primary SparkDEX integration
    description: "SparkDEX V3.1 with concentrated liquidity (1433x more liquidity than V2)"

  # BlazeSwap - Uniswap V2 fork with unique FTSO delegation features
  # Liquidity providers earn both trading fees and FTSO rewards
  - name: BlazeSwap
    type: uniswap_v2              # Uniswap V2 clone (CPAMM)
    factory_address: "0x440602f459D7Dd500a74528003e6A20A46d6e2A6"  # BlazeSwap Factory (CORRECTED)
    router_address: "0xe3A1b355ca63abCBC9589334B5e609583C7BAa06"   # BlazeSwap Router
    enabled: true
    description: "First open-source DEX on Flare with automatic FTSO delegation"

  # Pangolin - Multichain DEX originally from Avalanche
  # Launched on Flare in July 2024, brings cross-chain liquidity
  # NOTE: Currently disabled - FXRP pairs don't exist on Pangolin yet
  - name: Pangolin
    type: uniswap_v2              # Standard Uniswap V2 implementation
    factory_address: "0xbfe13753156b9c6b2818FB45ff3D2392ea43d79A"  # Pangolin Factory
    router_address: "0xA981cb468c87Ed32F37dE546e25a7c5FF17e2308"   # Pangolin Router
    enabled: false                # Disabled - no FXRP pairs available
    description: "Established multichain DEX with strong track record"

  # Enosys - Dual V2/V3 DEX implementation
  # TODO: Verify factory and router addresses for Enosys DEX
  # These are placeholder addresses and must be updated before production use
  - name: Enosys
    type: uniswap_v2              # Using V2 for MVP (also has V3 support)
    factory_address: "0x0000000000000000000000000000000000000000"  # TODO: Verify Enosys V2 Factory
    router_address: "0x0000000000000000000000000000000000000000"   # TODO: Verify Enosys V2 Router
    enabled: false                # Disabled until addresses are verified
    description: "Dual V2/V3 DEX with concentrated liquidity options (addresses need verification)"


# ============================================================================
# TOKEN CONFIGURATION
# ============================================================================
# ERC-20 token contracts on Flare Network
# Includes contract addresses and decimal precision for price calculations

tokens:
  # FXRP - Tokenized XRP on Flare (FAsset)
  # 1:1 overcollateralized representation of XRP for DeFi use
  FXRP:
    address: "0xad552a648c74d49e10027ab8a618a3ad4901c5be"  # FXRP token contract
    decimals: 6                                            # CRITICAL: FXRP uses 6 decimals (NOT 18!)
    symbol: "FXRP"
    name: "FXRP (FAsset XRP)"
    description: "Overcollateralized XRP token on Flare Network"

  # USDT0 - Tether USD using LayerZero OFT standard
  # Native omnichain USDT (not a bridge/wrapped token)
  USDT0:
    address: "0xe7cd86e13AC4309349F30B3435a9d337750fC82D"  # USDT0 token contract
    decimals: 6                                            # Standard USDT decimals (NOT 18!)
    symbol: "USDT0"
    name: "USD₮0 (Tether USD)"
    description: "LayerZero OFT implementation of USDT on Flare"

  # WFLR - Wrapped Flare (native token wrapper)
  # Required for DeFi operations with the native FLR token
  WFLR:
    address: "0x1D80c49BbBCd1C0911346656B529DF9E5c2F783d"  # WNat contract (Wrapped FLR)
    decimals: 18                                           # Standard wrapped token decimals
    symbol: "WFLR"
    name: "Wrapped Flare"
    description: "ERC-20 wrapped version of native FLR token"


# ============================================================================
# TRADING PAIRS CONFIGURATION
# ============================================================================
# Pairs to monitor for arbitrage opportunities
# All 3 pairs are required for MVP to enable direct and triangular arbitrage detection

pairs:
  # FXRP/USDT0 - Primary trading pair (highest volume and liquidity)
  # Direct USD pricing for FXRP, main arbitrage opportunities
  - base: FXRP                    # Base token (token being priced)
    quote: USDT0                  # Quote token (pricing denomination)
    enabled: true
    description: "Primary FXRP pair with highest liquidity (up to 50% APR incentives)"

  # FXRP/WFLR - Secondary pair for FLR-denominated pricing
  # Important for triangular arbitrage paths
  - base: FXRP
    quote: WFLR
    enabled: true
    description: "Native token pairing, alternative arbitrage paths"

  # WFLR/USDT0 - Reference pair for cross-validation
  # Required to convert FXRP/WFLR prices to USD equivalent
  # Enables triangular arbitrage: FXRP/USDT0 vs (FXRP/WFLR + WFLR/USDT0)
  - base: WFLR
    quote: USDT0
    enabled: true
    description: "Reference pair for USD conversion and triangular arbitrage"


# ============================================================================
# MONITORING SETTINGS
# ============================================================================
# Configure how frequently to poll DEXes and when to trigger alerts

monitoring:
  # Polling interval in seconds (how often to fetch prices from DEXes)
  # Lower values = more real-time data but higher RPC usage
  # RATE LIMIT FIX: Increased to 10 seconds to avoid 429 errors from public RPC
  # Use 5-10s for public endpoints, 2s if you have a private/paid RPC endpoint
  poll_interval_seconds: 10

  # Spread alert threshold as a percentage (0-100)
  # Only report arbitrage opportunities above this threshold
  # Example: 5.0 means only alert when spread > 5%
  # This helps filter noise and focus on profitable opportunities
  spread_alert_threshold_percent: 5.0

  # Maximum number of concurrent RPC requests
  # Limits parallelism to avoid overwhelming RPC endpoints
  # RATE LIMIT FIX: Reduced to 5 to avoid overwhelming public RPC
  # Increase to 10+ if using a private/paid RPC endpoint
  max_concurrent_requests: 5

  # Request timeout in seconds
  # How long to wait for RPC responses before considering it failed
  # Default: 5 seconds is reasonable for public endpoints
  request_timeout_seconds: 5

  # Retry configuration for failed requests
  max_retries: 3                  # Number of retry attempts for failed RPC calls
  retry_backoff_seconds: 2        # Initial delay between retries (exponential backoff)

  # Price staleness threshold in seconds
  # Alert if no price update received within this timeframe
  # Helps detect DEX or RPC issues
  price_staleness_threshold_seconds: 30


# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
# Control logging verbosity and output destinations

logging:
  # Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  # - DEBUG: Detailed information for troubleshooting (very verbose)
  # - INFO: General informational messages about normal operation
  # - WARNING: Warning messages for degraded performance or recoverable errors
  # - ERROR: Error messages for failures that don't crash the application
  # - CRITICAL: Critical errors that may cause application shutdown
  level: INFO

  # Log output format
  # Options: console, file, both
  # Changed to 'both' so you can tail the log file to see errors that scroll away
  output: both

  # Log file path (only used if output is 'file' or 'both')
  file_path: "logs/flare-monitor.log"

  # Enable file rotation to prevent log files from growing too large
  enable_rotation: true
  max_file_size_mb: 10            # Rotate when log file exceeds this size
  backup_count: 5                 # Keep this many rotated log files


# ============================================================================
# DISPLAY SETTINGS
# ============================================================================
# Configure console output appearance and behavior

display:
  # Enable rich console formatting (colors, tables, formatting)
  enable_rich_output: true

  # Refresh rate for live-updating console display (seconds)
  # How often to redraw the price table in the terminal
  refresh_interval_seconds: 1

  # Color coding for spreads
  # Thresholds for different alert levels (percentages)
  color_thresholds:
    high_opportunity: 5.0         # Green: Spreads >= 5% (profitable arbitrage)
    medium_opportunity: 2.0       # Yellow: Spreads 2-5% (marginal opportunities)
    low_opportunity: 0.5          # White: Spreads < 2% (likely not profitable)


# ============================================================================
# ADVANCED SETTINGS (Optional)
# ============================================================================
# Advanced configuration for experienced users

advanced:
  # Use multicall contract for batching multiple read operations
  # Can reduce RPC calls but requires multicall contract deployment
  enable_multicall: false
  multicall_address: ""           # Leave empty to disable

  # Enable gas price estimation for profitability calculations
  # Estimates cost of executing arbitrage transactions
  enable_gas_estimation: false

  # Slippage tolerance for profitability calculations (percentage)
  # Account for expected price impact when executing large trades
  slippage_tolerance_percent: 0.5

  # Cache DEX pair addresses to reduce RPC calls
  # Pairs are cached after first lookup (factory.getPair calls)
  enable_pair_cache: true

  # Enable WebSocket connections for real-time updates (future feature)
  # Currently not implemented - polling is used for all DEXes
  enable_websocket: false


# ============================================================================
# NOTES
# ============================================================================
#
# Configuration Best Practices:
# 1. Start with default settings and adjust based on observed performance
# 2. Monitor RPC rate limits - reduce poll_interval or max_concurrent_requests if hitting limits
# 3. Set spread_alert_threshold high enough to filter noise but low enough to catch opportunities
# 4. Use DEBUG logging only for troubleshooting - it generates significant output
# 5. Verify all contract addresses on Flarescan before use: https://flarescan.com
#
# Security Considerations:
# 1. This is a READ-ONLY monitoring tool - no private keys or transaction signing
# 2. Never commit API keys or sensitive data to version control
# 3. Use environment variables for RPC endpoints if using private/paid providers
# 4. Validate all addresses against official DEX documentation
#
# Troubleshooting:
# - If prices aren't updating: Check RPC connectivity and DEX contract addresses
# - If seeing frequent errors: Increase poll_interval or enable fallback RPC endpoints
# - If spreads seem incorrect: Verify token decimal settings (especially USDT0 = 6 decimals)
# - If performance is slow: Reduce max_concurrent_requests or enable pair caching
#
# Additional Resources:
# - Flare Documentation: https://docs.flare.network
# - SparkDEX Docs: https://docs.sparkdex.ai
# - BlazeSwap GitHub: https://github.com/blazeswap/contracts
# - Pangolin Docs: https://docs.pangolin.exchange
# - Block Explorer: https://flarescan.com
#
# ============================================================================
